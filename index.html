<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Gerenciador de gastos</h1><p class="sub">Registre entradas e saídas e veja para onde seu dinheiro vai.</p></div>
    <div style="min-width:180px"><label for="mes">Período</label><select id="mes"></select></div>
  </header>

  <section class="kpis" aria-label="Resumo">
    <div class="card kpi"><small>Entradas</small><b class="in" id="kIn">R$ 0,00</b></div>
    <div class="card kpi"><small>Saídas</small><b class="out" id="kOut">R$ 0,00</b></div>
    <div class="card kpi"><small>Saldo do período</small><b id="kBal">R$ 0,00</b></div>
  </section>

  <section class="grid">
    <div class="card"><h2>Saídas por categoria</h2><div class="chart"><canvas id="cCat" role="img" aria-label="Gráfico de saídas por categoria"></canvas></div></div>
    <div class="card"><h2>Entradas e saídas por mês</h2><div class="chart"><canvas id="cMes" role="img" aria-label="Gráfico mensal"></canvas></div></div>
  </section>

  <section class="card" style="margin-bottom:12px">
    <h2>Nova transação</h2>
    <form id="f">
      <div><label for="desc">Descrição</label><input id="desc" required maxlength="60" placeholder="Ex.: Mercado"></div>
      <div><label for="val">Valor (R$)</label><input id="val" type="number" step="0.01" min="0.01" required></div>
      <div><label for="tipo">Tipo</label><select id="tipo"><option value="out">Saída</option><option value="in">Entrada</option></select></div>
      <div><label for="cat">Categoria</label><select id="cat"></select></div>
      <div><label for="data">Data</label><input id="data" type="date" required></div>
      <button class="btn" type="submit">Adicionar</button>
    </form>
  </section>

  <section class="card">
    <div class="bar" style="justify-content:space-between;align-items:center">
      <h2 style="margin:0">Transações</h2>
      <div style="display:flex;gap:8px"><button class="ghost" id="demo">Carregar exemplo</button><button class="ghost" id="clear">Limpar tudo</button></div>
    </div>
    <div id="list"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
